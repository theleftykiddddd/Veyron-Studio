name: Build Veyron Studio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Geode CLI
      uses: geode-sdk/install-geode-cli@v1

    - name: Build Mod
      run: geode build --config RelWithDebInfo
